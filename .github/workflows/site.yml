name: Site

on:
  push:
    branches: [master]
    paths: ["src/**", "web/**", "Cargo.*", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.site.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: site
        run: echo "ready=$(test -f web/site/index.html && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.site.outputs.ready == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - if: steps.site.outputs.ready == 'yes'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - if: steps.site.outputs.ready == 'yes'
        run: |
          mkdir -p _site
          cp -R web/site/. _site/
          web/build.sh _site/merl.wasm
          if [ -f web/site/review.json ]; then node web/review/check.mjs _site/merl.wasm web/site/review.json; fi
          gzip -9 _site/merl.wasm
      - if: steps.site.outputs.ready == 'yes'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
