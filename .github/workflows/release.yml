name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml and CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$cargo" ] || { echo "tag v$tag but Cargo.toml says $cargo"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no ## [$tag] section"; exit 1; }
          test -f "docs/releases/$tag.md" || { echo "docs/releases/$tag.md is missing"; exit 1; }
      - name: Create the release from docs/releases
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "merl $tag" --notes-file "docs/releases/$tag.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: merl
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  check-glibc:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'merl-*-linux-gnu.tar.gz'
          for asset in merl-*-linux-gnu.tar.gz; do
            tar xzf "$asset" merl
            max=$(readelf --version-info merl | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$asset needs $max"
            [ "$(printf '%s\n' GLIBC_2.17 "$max" | sort -V | tail -1)" = GLIBC_2.17 ] || { echo "$asset needs $max, above GLIBC_2.17"; exit 1; }
            rm merl
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-tap:
    needs: check-glibc
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: Maksim-Burtsev/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo Maksim-Burtsev/merl --pattern '*.sha256'
          python3 - "$version" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          formula = pathlib.Path("Formula/merl.rb")
          text = formula.read_text()
          old = re.search(r'^  version "(.*)"', text, re.M).group(1)
          text = text.replace(old, version)
          for f in pathlib.Path(".").glob("merl-*.sha256"):
              target = f.name[len("merl-"):-len(".sha256")]
              sha = f.read_text().split()[0]
              text, n = re.subn(rf'({re.escape(target)}\.tar\.gz"\n\s*sha256 ")[0-9a-f]+', rf"\g<1>{sha}", text)
              assert n == 1, f"Formula/merl.rb has no sha256 line for {target}"
          formula.write_text(text)
          PY
          git diff --exit-code Formula/merl.rb && { echo "formula already at $version"; exit 0; }
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "merl $version"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
