name: Deny

on:
  push:
    branches: [master]
    paths: [Cargo.lock, deny.toml]
  pull_request:
    paths: [Cargo.lock, deny.toml]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
