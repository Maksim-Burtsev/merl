name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # `d`, `u` and `D` at every cursor position of every fixture, failing on a panic (#543): 50
  # minutes on one runner in release, so only a release PR plays it, in shards (#711).
  no-panic:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked no_panic -- --ignored
        env:
          MERL_NO_PANIC_SHARD: ${{ matrix.shard }}/4

  check:
    name: check (${{ matrix.os }})
    # The checks the merge requires wait for the shards and fail unless all passed, a cancelled
    # run included: a skipped required check would count as passed. On any other PR the shards
    # are skipped and the checks start at once.
    needs: no-panic
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - if: needs.no-panic.result != 'success' && needs.no-panic.result != 'skipped'
        run: echo "the panic sweep did not pass (${{ needs.no-panic.result }})" && exit 1
      # A PR that touches only what agents read (skills, AGENTS.md, release notes) builds nothing:
      # no test reads those files, and the check passes in seconds instead of minutes.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate --jq '.[].filename' \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files)
          grep -qvE '^(\.claude/|docs/releases/|AGENTS\.md$|CLAUDE\.md$)' <<<"$files" \
            || echo DOCS_ONLY=1 >> "$GITHUB_ENV"
      # The whole history and origin/master: a test compares the released sections of
      # CHANGELOG.md with the last `release:` commit on master (#706).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: ${{ !env.DOCS_ONLY }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: ${{ !env.DOCS_ONLY }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ !env.DOCS_ONLY }}
        run: cargo fmt --check
      - if: ${{ !env.DOCS_ONLY }}
        run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !env.DOCS_ONLY }}
        run: cargo test --locked
      - if: ${{ !env.DOCS_ONLY }}
        run: cargo build --release --locked
      # The `d` bench's scoring and its no-cursor-worse gate, on made-up rows: no clone needed.
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/d-bench/run --selftest
      # The smoke scenarios in tmux on this build, every checkpoint against the screen checked in
      # under tests/smoke/screens (#309): a changed screen fails here with its diff. Go for the `d`
      # into its standard library. Homebrew's tmux on both: Ubuntu's 3.4 draws an emoji with a
      # variation selector one column wide, where Homebrew's and the owner's terminal draw two.
      - if: ${{ !env.DOCS_ONLY }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - if: ${{ !env.DOCS_ONLY }}
        name: smoke screens
        env:
          LANG: C.UTF-8
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq python3-pil
            /home/linuxbrew/.linuxbrew/bin/brew install -q tmux
            export PATH="/home/linuxbrew/.linuxbrew/opt/tmux/bin:$PATH"
          else
            python3 -m pip install -q --break-system-packages pillow
            brew install -q tmux
          fi
          tmux -V
          tests/smoke/run.py --golden --new target/release/merl
      # The oldest Rust `Cargo.toml` allows builds merl too (#320), in a check the merge waits for.
      - if: matrix.os == 'ubuntu-latest' && !env.DOCS_ONLY
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked
