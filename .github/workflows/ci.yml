name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The smoke scenarios in tmux on this build, every checkpoint against the screen checked in
      # under tests/smoke/screens (#309): a changed screen fails here with its diff.
      - name: smoke screens
        env:
          LANG: C.UTF-8
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq tmux python3-pil
          else
            brew install tmux
            python3 -m pip install -q --break-system-packages pillow
          fi
          tests/smoke/run.py --golden --new target/release/merl
      # The oldest Rust `Cargo.toml` allows builds merl too (#320), in a check the merge waits for.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked
