name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  no-panic:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci-local panic
        env:
          MERL_NO_PANIC_SHARD: ${{ matrix.shard }}/4

  check:
    name: check (${{ matrix.os }})
    needs: no-panic
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - if: needs.no-panic.result != 'success' && needs.no-panic.result != 'skipped'
        run: echo "the panic sweep did not pass (${{ needs.no-panic.result }})" && exit 1
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate --jq '.[].filename' \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files)
          grep -qvE '^(\.claude/|docs/releases/|AGENTS\.md$|CLAUDE\.md$)' <<<"$files" \
            || echo DOCS_ONLY=1 >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: ${{ !env.DOCS_ONLY }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: ${{ !env.DOCS_ONLY }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/ci-local fmt
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/ci-local clippy
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/ci-local tests
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/ci-local release
      - if: ${{ !env.DOCS_ONLY }}
        run: tools/ci-local dbench
      - if: ${{ !env.DOCS_ONLY }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - if: ${{ !env.DOCS_ONLY }}
        name: smoke screens
        env:
          LANG: C.UTF-8
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq python3-pil
            /home/linuxbrew/.linuxbrew/bin/brew install -q tmux
            export PATH="/home/linuxbrew/.linuxbrew/opt/tmux/bin:$PATH"
          else
            python3 -m pip install -q --break-system-packages pillow
            brew install -q tmux
          fi
          tmux -V
          tools/ci-local smoke
      - if: matrix.os == 'ubuntu-latest' && !env.DOCS_ONLY
        run: tools/ci-local msrv
