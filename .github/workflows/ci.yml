name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # `d`, `u` and `D` at every cursor position of every fixture, failing on a panic (#543):
      # half an hour in debug, so `cargo test` skips it and one runner plays it here in release.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked no_panic -- --ignored
      # The `d` bench's scoring and its no-cursor-worse gate, on made-up rows: no clone needed.
      - run: tools/d-bench/run --selftest
      # The smoke scenarios in tmux on this build, every checkpoint against the screen checked in
      # under tests/smoke/screens (#309): a changed screen fails here with its diff. Go for the `d`
      # into its standard library. Homebrew's tmux on both: Ubuntu's 3.4 draws an emoji with a
      # variation selector one column wide, where Homebrew's and the owner's terminal draw two.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: smoke screens
        env:
          LANG: C.UTF-8
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq python3-pil
            /home/linuxbrew/.linuxbrew/bin/brew install -q tmux
            export PATH="/home/linuxbrew/.linuxbrew/opt/tmux/bin:$PATH"
          else
            python3 -m pip install -q --break-system-packages pillow
            brew install -q tmux
          fi
          tmux -V
          tests/smoke/run.py --golden --new target/release/merl
      # The oldest Rust `Cargo.toml` allows builds merl too (#320), in a check the merge waits for.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked
