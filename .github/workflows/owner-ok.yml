name: Owner ok

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  merge:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'Maksim-Burtsev'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - env:
          BODY: ${{ github.event.comment.body }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          body=$(printf '%s' "$BODY" | tr '[:upper:]' '[:lower:]' | sed -z 's/^[[:space:]]*//; s/[[:space:]]*$//')
          case "$body" in ok|ok.|ok!) ;; *) exit 0 ;; esac
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::The repository secret MERGE_TOKEN is not set."
            exit 1
          fi
          say() { gh pr comment "$PR" --body "$1"; exit 0; }
          for _ in 1 2 3 4 5 6; do
            read -r state base mergeable < <(gh pr view "$PR" --json state,baseRefName,mergeable \
              --jq '"\(.state) \(.baseRefName) \(.mergeable)"')
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          [ "$state" = OPEN ] || say "The PR is ${state,,}: nothing to merge."
          [ "$base" = master ] || say "Based on \`$base\`, not master: needs an agent."
          [ "$mergeable" = CONFLICTING ] && say "Conflicts with master: needs an agent."
          if ! err=$(GH_TOKEN=$MERGE_TOKEN gh pr merge "$PR" --squash --auto 2>&1); then
            say "Could not enable the merge: ${err//$'\n'/ }"
          fi
          gh pr edit "$PR" --remove-label needs-owner
