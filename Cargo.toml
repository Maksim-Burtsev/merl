[package]
name = "merl"
version = "0.8.4"
edition = "2024"
rust-version = "1.95"
description = "Keyboard-only code navigator for the terminal"
license = "MIT"
repository = "https://github.com/Maksim-Burtsev/merl"
keywords = ["code-navigator", "code-review", "go-to-definition", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/assets"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
merman = { version = "0.7", default-features = false, features = ["raster"] }
notify = "8"
nucleo = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
syntect = "5.3"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = { version = "=0.23.4", git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "c009222808634c1014f82438d4883753516a2c24" }
tree-sitter-css = "=0.25.0"
tree-sitter-diff = { version = "=0.2.0", git = "https://github.com/tree-sitter-grammars/tree-sitter-diff", rev = "ada384ac7bfc1307f32de474620120add29998fb" }
tree-sitter-html = "=0.23.2"
tree-sitter-xml = { version = "=0.7.0", git = "https://github.com/tree-sitter-grammars/tree-sitter-xml", rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d" }
tree-sitter-go = "=0.25.0"
tree-sitter-json = { version = "=0.24.8", git = "https://github.com/tree-sitter/tree-sitter-json", rev = "254c42a6476413b776221e03982ac8ae159eeb72" }
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-jsdoc = "=0.25.0"
tree-sitter-md = "=0.5.3"
tree-sitter-printf = "=0.5.1"
tree-sitter-python = "=0.25.0"
tree-sitter-regex = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = { version = "=0.7.2", git = "https://github.com/tree-sitter-grammars/tree-sitter-yaml", rev = "a1c4812a73ec5e089de8e441fdea3a921e8d5079" }
tree-sitter-lua = "=0.5.0"
tree-sitter-luadoc = { version = "=1.1.0", git = "https://github.com/tree-sitter-grammars/tree-sitter-luadoc", rev = "4d04632a3a398b78af52e83be074883e722f40be" }
two-face = "0.5"
unicase = "2.6"
unicode-segmentation = "1"

[profile.dev.package."*"]
opt-level = 2
