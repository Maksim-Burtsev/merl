[package]
name = "merl"
version = "0.6.0"
edition = "2024"
description = "The one editor you need when agents write the code: read a project, review a branch, fix a line"
license = "MIT"
repository = "https://github.com/Maksim-Burtsev/merl"
keywords = ["tui", "terminal", "viewer", "code", "navigator"]
categories = ["command-line-utilities", "text-editors"]
exclude = ["/assets"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8"
nucleo = "0.5"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
syntect = "5.3"
toml = "1.1"
two-face = "0.5"
unicode-segmentation = "1"
