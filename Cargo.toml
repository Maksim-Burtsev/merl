[package]
name = "merl"
version = "0.8.3"
edition = "2024"
rust-version = "1.95"
description = "Keyboard-only code navigator for the terminal"
license = "MIT"
repository = "https://github.com/Maksim-Burtsev/merl"
keywords = ["code-navigator", "code-review", "go-to-definition", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/assets"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
merman = { version = "0.7", default-features = false, features = ["raster"] }
notify = "8"
nucleo = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
syntect = "5.3"
toml = "1.1"
two-face = "0.5"
unicase = "2.6"
unicode-segmentation = "1"

# The tests run regex, syntect and nucleo in the dev profile, where compiling the symbol patterns
# alone costs seconds a press of `D`: optimised dependencies take `cargo test` from ~75 s to ~10 s.
# merl's own code stays unoptimised, so it builds and debugs as before.
[profile.dev.package."*"]
opt-level = 2
