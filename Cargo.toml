[package]
name = "merl"
version = "0.1.1"
edition = "2024"
description = "Read-only terminal code navigator"
license = "MIT"
repository = "https://github.com/Maksim-Burtsev/merl"
keywords = ["tui", "terminal", "viewer", "code", "navigator"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8"
nucleo = "0.5"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
syntect = "5.3"
toml = "0.9"
two-face = "0.5"
unicode-width = "0.2"
