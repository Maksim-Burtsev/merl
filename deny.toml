[advisories]
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, through syntect (bat's syntax definitions), which has no release without it" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained, through syntect (bat's syntax definitions), which has no release without it" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, through merman's layout (manatee) and rasterizer (resvg, usvg); merman 0.7 has no release without it" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, through merman's layout (manatee) and rasterizer (resvg, usvg); merman 0.7 has no release without it" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, through merman; merman 0.7 has no release without it" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, through serde_yaml in merman-core 0.7" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/tree-sitter/tree-sitter-json",
  "https://github.com/tree-sitter/tree-sitter-cpp",
  "https://github.com/tree-sitter/tree-sitter-ruby",
  "https://github.com/fwcd/tree-sitter-kotlin",
  "https://github.com/tree-sitter-grammars/tree-sitter-yaml",
  "https://github.com/tree-sitter-grammars/tree-sitter-luadoc",
  "https://github.com/tree-sitter-grammars/tree-sitter-xml",
  "https://github.com/tree-sitter-grammars/tree-sitter-diff",
  "https://github.com/tree-sitter-grammars/tree-sitter-query",
  "https://github.com/coder3101/tree-sitter-proto",
  "https://github.com/tree-sitter-grammars/tree-sitter-zig",
]
