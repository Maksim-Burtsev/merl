# cargo-deny: advisories, licences and duplicate crates. `cargo deny check` runs it locally.

[advisories]
ignore = [
    # Both come through syntect (bat's syntax definitions); syntect has no release without them.
    "RUSTSEC-2024-0320", # yaml-rust unmaintained
    "RUSTSEC-2025-0141", # bincode 1 unmaintained
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
