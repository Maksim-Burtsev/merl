
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledger &amp; report</title>
  <link rel="stylesheet" href="/static/site.css">
  <style>
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
    .total > span:hover { color: #c0ffee !important; }
  </style>
  <script type="importmap">
    { "imports": { "app": "/static/app.js" } }
  </script>
</head>
<body class="page" data-id=42>
  <!-- the header -->
  <header id="top">
    <h1>Ledger</h1>
    <a href="#bottom" style="color: red; margin-left: 4px">down</a>
  </header>
  <main>
    <p>Entries <em>this</em> month: <strong>12</strong>&nbsp;items.</p>
    <ul>
      <li><a href="/e/1">Rent</a></li>
      <li><a href="/e/2" target="_blank">Food</a></li>
    </ul>
    <form action="/add" method="post">
      <label for="memo">Memo</label>
      <input id="memo" name="memo" required>
      <input name="amount" pattern="[0-9]+(\.[0-9]{2})?">
      <button type="submit" onclick="return confirm('Add?')">Add</button>
    </form>
    <img src="/logo.png" alt="logo" />
    <br>
  </main>
  <script>
    const rows = document.querySelectorAll("li");
    for (const row of rows) {
      row.addEventListener("click", () => console.log(row.textContent));
    }
  </script>
  <script type="text/javascript">
    window.total = 12 * 2;
  </script>
  <script type="module">
    import { start } from "app";
    start(document.body);
  </script>
</body>
</html>
