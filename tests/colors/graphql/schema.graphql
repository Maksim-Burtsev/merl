# A library schema, written to cover the grammar.
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
A point in time, as an ISO 8601 string.
"""
scalar DateTime @specifiedBy(url: "https://scalars.graphql.org/andimarek/date-time")

directive @auth(requires: Role = READER) repeatable on OBJECT | FIELD_DEFINITION
directive @cached(ttl: Int = 60) on QUERY | FIELD

enum Role {
  ADMIN
  READER @deprecated(reason: "use VIEWER")
  VIEWER
}

"A thing with an id."
interface Node {
  id: ID!
}

interface Named implements Node & Timestamped {
  id: ID!
  name: String
}

type Book implements Node & Named @auth(requires: ADMIN) {
  id: ID!
  name: String
  "The pages, counted from the cover."
  pages: Int!
  rating: Float
  tags(first: Int = 10, after: String): [String!]!
  published: DateTime
}

union SearchResult = Book | Author

input BookFilter {
  name: String = "untitled"
  minPages: Int = 0
  ratingAbove: Float = 4.5
  onlyNew: Boolean = true
  roles: [Role!] = [ADMIN, VIEWER]
  where: BookWhere = { name: "x", deleted: null }
}

type Query {
  node(id: ID!): Node
  books(filter: BookFilter): [Book!]!
  search(text: String!): [SearchResult!]!
}

extend type Book {
  author: Author
}

extend schema @link(url: "https://specs.apollo.dev/federation/v2.0")
extend scalar DateTime @cached
extend interface Node @auth
extend union SearchResult = Magazine
extend enum Role {
  OWNER
}
extend input BookFilter {
  author: String
}
