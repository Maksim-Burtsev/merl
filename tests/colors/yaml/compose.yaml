    <<: *defaults
    image: "nginx:1.25"
    ports:
      - "8080:80"
      - 443:443
    command: ["nginx", "-g", 'daemon off;']
    healthcheck: {test: [CMD, curl, -f, http://localhost], interval: 30s}
