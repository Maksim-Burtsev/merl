services:
  api:
    build: .
    command: make serve
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: [db]
  worker:
    build:
      context: worker
    environment:
      QUEUE_URL: redis://queue:6379/0
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
