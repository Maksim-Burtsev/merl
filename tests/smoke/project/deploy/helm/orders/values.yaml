replicaCount: 2

image:
  repository: ghcr.io/example/orders
  tag: ""
  pullPolicy: IfNotPresent

resources: &defaults
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

worker:
  replicaCount: 1
  resources: *defaults

service:
  type: ClusterIP
  port: 8000

env:
  PAGE_SIZE: "50"
